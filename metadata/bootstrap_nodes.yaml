# Consensus-layer bootstrap nodes (ENRs) for JOC mainnet (chain id 81).
#
# Liveness is proven, not dialled: ../scripts/discv5_probe.py makes each node
# answer WHOAREYOU, which only a node whose id is keccak256 of the key in its
# own record can do.
#
# Execution-layer counterpart: ./enodes.yaml
#
# Pass to a consensus client with:
#   lighthouse beacon_node --testnet-dir metadata \
#     --boot-nodes "$(sed -n 's/^-[[:space:]]*\(enr:[^[:space:]#]*\).*$/\1/p' \
#                     metadata/bootstrap_nodes.yaml | paste -sd, -)"

